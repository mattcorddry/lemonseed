# Lemonseed GRUB configuration (EFI) — A/B root selection via grubenv.
#
# Expected on the ESP:
#   /grub/grub.cfg          (this file)
#   /grub/grubenv           (environment block)
#   /EFI/lemonseed/vmlinuz-a
#   /EFI/lemonseed/vmlinuz-b
#   /EFI/lemonseed/initrd-a.img   (optional until no-initrd)
#   /EFI/lemonseed/initrd-b.img
#
# Root partitions are identified by PARTLABEL root-a / root-b (GPT).
# Variables: boot_default, boot_once, boot_attempted  (values: a|b)

set default=0
set timeout=3

insmod part_gpt
insmod fat
insmod squash4
insmod gzio
insmod chain

# Load persistent environment from the ESP.
load_env

# Decide slot: one-shot attempt wins, else permanent default, else "a".
if [ -n "${boot_once}" ]; then
  set slot="${boot_once}"
  set boot_attempted="${boot_once}"
  set boot_once=
  save_env boot_once boot_attempted
elif [ -n "${boot_default}" ]; then
  set slot="${boot_default}"
else
  set slot=a
fi

set root_label=root-${slot}
set kernel=/EFI/lemonseed/vmlinuz-${slot}
set initrd_path=/EFI/lemonseed/initrd-${slot}.img

# Runtime kernel params (e.g. ttm.pages_limit for APU GPU memory split).
# Written by lemonseed-amdgpu-kernel-params on first boot; persists across
# A/B updates because it lives on the ESP (writable, not in SquashFS).
# GRUB has no command substitution, so the file is a stub that sets the
# variable:  set kernel_params='ttm.pages_limit=… ttm.page_pool_size=…'
set kernel_params=""
if [ -f /grub/kernel-params ]; then
  source /grub/kernel-params
fi

# The chosen release channel (M8 P3): the installer writes this ESP stub for
# a beta choice (a fresh install has no @var yet); the control plane adopts
# it into its settings table at first boot and the materialized channel file
# outranks the command line from then on. Absence means stable.
set channel_params=""
if [ -f /grub/channel-params ]; then
  source /grub/channel-params
fi

# root=fstab: /etc and /var come from initrd fstab. The / sysroot mount is
# emitted by lemonseed-root-generator from lemonseed.slot= (real GPT label
# root-{a|b}). Do not pass root=PARTLABEL=… here — that would conflict with
# the generator's sysroot.mount. Stage-2 uses lemonseed-select-root.
menuentry "Lemonseed (slot ${slot})" --id lemonseed-default {
  echo "Booting Lemonseed slot ${slot}..."
  search --no-floppy --set=root --file "${kernel}"
  linux ${kernel} root=fstab init=/init lemonseed.slot=${slot} console=ttyS0,115200n8 console=tty0 ${kernel_params} ${channel_params}
  if [ -f "${initrd_path}" ]; then
    initrd ${initrd_path}
  fi
}

menuentry "Lemonseed slot a (manual)" --id lemonseed-a {
  search --no-floppy --set=root --file /EFI/lemonseed/vmlinuz-a
  linux /EFI/lemonseed/vmlinuz-a root=fstab init=/init lemonseed.slot=a console=ttyS0,115200n8 console=tty0 ${kernel_params} ${channel_params}
  if [ -f /EFI/lemonseed/initrd-a.img ]; then
    initrd /EFI/lemonseed/initrd-a.img
  fi
}

menuentry "Lemonseed slot b (manual)" --id lemonseed-b {
  search --no-floppy --set=root --file /EFI/lemonseed/vmlinuz-b
  linux /EFI/lemonseed/vmlinuz-b root=fstab init=/init lemonseed.slot=b console=ttyS0,115200n8 console=tty0 ${kernel_params} ${channel_params}
  if [ -f /EFI/lemonseed/initrd-b.img ]; then
    initrd /EFI/lemonseed/initrd-b.img
  fi
}
